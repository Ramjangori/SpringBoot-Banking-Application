<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta name="viewport"
	      content="width=device-width, initial-scale=1.0">

	<title>RupeeFlow — Login</title>

	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
	      rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	      rel="stylesheet">


	<style>

		:root {
			--navy: #0a1628;
			--blue: #1a56db;
			--accent: #3b82f6;
			--gold: #f5c842;
			--green: #10b981;
			--red: #f87171;
			--card: #182236;
			--border: #2a3a55;
			--text: #e2e8f0;
			--muted: #8a9ab5;
		}


		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}


		body {

			min-height: 100vh;

			background:
					radial-gradient(
							circle at 50% 0%,
							rgba(26, 86, 219, 0.14),
							transparent 40%
					),
					var(--navy);

			color: var(--text);

			font-family: 'DM Sans', sans-serif;
		}


		/* ================= HEADER ================= */

		.topbar {

			position: sticky;

			top: 0;

			z-index: 1000;

			height: 68px;

			padding: 0 32px;

			background: rgba(24, 34, 54, 0.96);

			backdrop-filter: blur(12px);

			border-bottom: 1px solid var(--border);

			display: flex;

			align-items: center;

			justify-content: space-between;
		}


		.brand {

			display: flex;

			align-items: center;

			gap: 10px;

			text-decoration: none;
		}


		.brand-icon {

			width: 38px;

			height: 38px;

			background: var(--blue);

			border-radius: 10px;

			display: flex;

			align-items: center;

			justify-content: center;

			color: white;

			font-size: 18px;

			box-shadow:
					0 6px 18px rgba(26, 86, 219, 0.25);
		}


		.brand-name {

			color: white;

			font-size: 1.2rem;

			font-weight: 700;
		}


		.brand-name span {

			color: var(--gold);
		}


		/* ================= BACK BUTTON ================= */

		.back-btn {

			display: flex;

			align-items: center;

			gap: 7px;

			padding: 8px 14px;

			border-radius: 9px;

			border: 1px solid var(--border);

			background: rgba(255, 255, 255, 0.025);

			color: var(--muted);

			text-decoration: none;

			font-size: 0.82rem;

			transition: 0.2s;
		}


		.back-btn:hover {

			color: white;

			border-color: var(--accent);

			background: rgba(59, 130, 246, 0.08);
		}


		/* ================= PAGE ================= */

		.page {

			width: 100%;

			max-width: 520px;

			margin: 0 auto;

			padding: 55px 20px 60px;
		}


		/* ================= INTRO ================= */

		.page-intro {

			text-align: center;

			margin-bottom: 24px;
		}


		.page-icon {

			width: 52px;

			height: 52px;

			margin: 0 auto 12px;

			border-radius: 15px;

			background: rgba(16, 185, 129, 0.10);

			border: 1px solid rgba(16, 185, 129, 0.2);

			color: var(--green);

			display: flex;

			align-items: center;

			justify-content: center;

			font-size: 1.35rem;
		}


		.page-intro h1 {

			color: white;

			font-size: 1.45rem;

			font-weight: 700;

			margin-bottom: 5px;
		}


		.page-intro p {

			color: var(--muted);

			font-size: 0.8rem;
		}


		/* ================= CARD ================= */

		.form-card {

			background: rgba(24, 34, 54, 0.96);

			border: 1px solid var(--border);

			border-radius: 18px;

			overflow: hidden;

			box-shadow:
					0 20px 60px rgba(0, 0, 0, 0.25);
		}


		/* ================= CARD HEADER ================= */

		.card-top {

			padding: 23px 28px;

			background:
					linear-gradient(
							135deg,
							#1a56db,
							#1748b8
					);

			border-bottom: 1px solid rgba(255,255,255,0.1);
		}


		.card-top-row {

			display: flex;

			align-items: center;

			gap: 14px;
		}


		.card-top-icon {

			width: 44px;

			height: 44px;

			flex-shrink: 0;

			border-radius: 12px;

			background: rgba(255,255,255,0.13);

			border: 1px solid rgba(255,255,255,0.2);

			display: flex;

			align-items: center;

			justify-content: center;

			color: white;

			font-size: 1.15rem;
		}


		.card-top h2 {

			color: white;

			font-size: 1.08rem;

			font-weight: 700;

			margin-bottom: 3px;
		}


		.card-top p {

			color: #dbeafe;

			font-size: 0.76rem;
		}


		/* ================= CARD BODY ================= */

		.card-body {

			padding: 28px;
		}


		/* ================= FIELD ================= */

		.field {

			margin-bottom: 19px;
		}


		.field label {

			display: block;

			margin-bottom: 7px;

			color: #a9b7cc;

			font-size: 0.7rem;

			font-weight: 600;

			text-transform: uppercase;

			letter-spacing: 0.45px;
		}


		.input-wrap {

			position: relative;
		}


		.input-wrap > i {

			position: absolute;

			left: 14px;

			top: 50%;

			transform: translateY(-50%);

			color: var(--muted);

			font-size: 0.98rem;

			pointer-events: none;

			transition: 0.2s;
		}


		.form-input {

			width: 100%;

			height: 47px;

			padding: 0 14px 0 40px;

			background: rgba(255,255,255,0.035);

			border: 1px solid var(--border);

			border-radius: 10px;

			outline: none;

			color: var(--text);

			font-family: 'DM Sans', sans-serif;

			font-size: 0.86rem;

			transition: 0.2s;
		}


		.form-input::placeholder {

			color: #667895;
		}


		.form-input:hover {

			border-color: #3b4d69;
		}


		.form-input:focus {

			border-color: var(--accent);

			background: rgba(59,130,246,0.055);

			box-shadow:
					0 0 0 3px rgba(59,130,246,0.08);
		}


		/* ================= PASSWORD ================= */

		.password-input {

			padding-right: 45px;
		}


		.password-toggle {

			position: absolute;

			right: 13px;

			top: 50%;

			transform: translateY(-50%);

			border: none;

			background: transparent;

			color: var(--muted);

			cursor: pointer;

			font-size: 1rem;
		}


		.password-toggle:hover {

			color: white;
		}


		/* ================= BUTTON ================= */

		.login-btn {

			width: 100%;

			height: 47px;

			margin-top: 2px;

			border: none;

			border-radius: 10px;

			background: var(--blue);

			color: white;

			font-family: 'DM Sans', sans-serif;

			font-size: 0.88rem;

			font-weight: 600;

			cursor: pointer;

			display: flex;

			align-items: center;

			justify-content: center;

			gap: 8px;

			transition: 0.2s;

			box-shadow:
					0 8px 20px rgba(26,86,219,0.2);
		}


		.login-btn:hover {

			background: #2563eb;

			transform: translateY(-1px);

			box-shadow:
					0 10px 25px rgba(26,86,219,0.28);
		}


		.login-btn:disabled {

			opacity: 0.6;

			cursor: not-allowed;

			transform: none;
		}


		/* ================= RESULT ================= */

		#result {

			margin-top: 16px;

			border-radius: 10px;

			padding: 12px 14px;

			font-size: 0.78rem;

			line-height: 1.45;

			display: none;

			align-items: flex-start;

			gap: 8px;
		}


		#result.success {

			display: flex;

			background: rgba(16,185,129,0.08);

			border: 1px solid rgba(16,185,129,0.22);

			color: var(--green);
		}


		#result.error {

			display: flex;

			background: rgba(248,113,113,0.08);

			border: 1px solid rgba(248,113,113,0.22);

			color: var(--red);
		}


		/* ================= SECURITY ================= */

		.secure-note {

			display: flex;

			justify-content: center;

			align-items: center;

			gap: 6px;

			margin-top: 18px;

			color: var(--muted);

			font-size: 0.7rem;
		}


		.secure-note i {

			color: var(--green);

			font-size: 0.8rem;
		}


		/* ================= MOBILE ================= */

		@media (max-width: 600px) {

			.topbar {

				height: 62px;

				padding: 0 16px;
			}


			.brand-icon {

				width: 35px;

				height: 35px;
			}


			.brand-name {

				font-size: 1.05rem;
			}


			.back-btn {

				padding: 7px 10px;

				font-size: 0.75rem;
			}


			.page {

				padding: 32px 14px 40px;
			}


			.card-top {

				padding: 20px;
			}


			.card-body {

				padding: 22px 20px 24px;
			}


			.page-intro h1 {

				font-size: 1.3rem;
			}

		}

	</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<nav class="topbar">

	<a href="index.html"
	   class="brand">

		<div class="brand-icon">

			<i class="bi bi-bank2"></i>

		</div>


		<span class="brand-name">

            Rupee<span>Flow</span>

        </span>

	</a>


	<a href="index.html"
	   class="back-btn">

		<i class="bi bi-arrow-left"></i>

		Back to Home

	</a>

</nav>



<!-- ================= PAGE ================= -->

<main class="page">


	<!-- INTRO -->

	<div class="page-intro">

		<div class="page-icon">

			<i class="bi bi-box-arrow-in-right"></i>

		</div>


		<h1>

			Login to Your Account

		</h1>


		<p>

			Enter your account credentials to continue

		</p>

	</div>



	<!-- ================= CARD ================= -->

	<div class="form-card">


		<!-- CARD TOP -->

		<div class="card-top">

			<div class="card-top-row">

				<div class="card-top-icon">

					<i class="bi bi-person-check-fill"></i>

				</div>


				<div>

					<h2>

						Existing Account

					</h2>


					<p>

						Enter your account number and password

					</p>

				</div>

			</div>

		</div>



		<!-- CARD BODY -->

		<div class="card-body">


			<!-- ACCOUNT NUMBER -->

			<div class="field">

				<label>

					Account Number

				</label>


				<div class="input-wrap">

					<input
							type="text"
							id="accountNumber"
							class="form-input"
							placeholder="Enter your account number"
							autocomplete="username"
					>

					<i class="bi bi-credit-card"></i>

				</div>

			</div>



			<!-- PASSWORD -->

			<div class="field">

				<label>

					Password

				</label>


				<div class="input-wrap">

					<input
							type="password"
							id="password"
							class="form-input password-input"
							placeholder="Enter your password"
							autocomplete="current-password"
					>

					<i class="bi bi-lock-fill"></i>


					<button
							type="button"
							class="password-toggle"
							onclick="togglePassword()"
					>

						<i
								id="passwordIcon"
								class="bi bi-eye"
						></i>

					</button>

				</div>

			</div>



			<!-- LOGIN BUTTON -->

			<button
					type="button"
					id="loginBtn"
					class="login-btn"
					onclick="addAccount()"
			>

				<i class="bi bi-box-arrow-in-right"></i>

				Login

			</button>



			<!-- RESULT -->

			<div id="result"></div>

		</div>

	</div>



	<!-- SECURITY -->

	<div class="secure-note">

		<i class="bi bi-shield-check"></i>

		Your account information is securely processed.

	</div>


</main>



<script>


	/* ================= PASSWORD TOGGLE ================= */

	function togglePassword() {

		const password =
				document.getElementById("password");

		const icon =
				document.getElementById("passwordIcon");


		if (password.type === "password") {

			password.type = "text";

			icon.className =
					"bi bi-eye-slash";

		} else {

			password.type = "password";

			icon.className =
					"bi bi-eye";

		}

	}



	/* ================= LOGIN ================= */

	function addAccount() {


		const accountNumber =
				document
						.getElementById("accountNumber")
						.value
						.trim();


		const password =
				document
						.getElementById("password")
						.value;


		const result =
				document.getElementById("result");


		const button =
				document.getElementById("loginBtn");



		/* ---------- Validation ---------- */

		if (!accountNumber || !password) {

			showError(
					"Please enter account number and password."
			);

			return;
		}



		/* ---------- Loading ---------- */

		button.disabled = true;

		button.innerHTML = `

            <i class="bi bi-hourglass-split"></i>

            Logging in...

        `;



		/*
         * encodeURIComponent is used so that
         * special characters in password don't
         * break the URL.
         */

		const url =
				"/accounts/login"
				+ "?accountNumber="
				+ encodeURIComponent(accountNumber)
				+ "&password="
				+ encodeURIComponent(password);



		fetch(url, {

			method: "POST"

		})


				.then(async response => {

					const data =
							await response.json();


					if (!response.ok) {

						throw new Error(
								data.message ||
								"Invalid Account Number Or Password"
						);

					}


					return data;

				})


				.then(data => {


					/* Save logged-in user */

					localStorage.setItem(
							"holderName",
							data.holderName
					);


					localStorage.setItem(
							"accountNumber",
							data.accountNumber
					);


					/* Success */

					result.className = "success";


					result.innerHTML = `

                <i class="bi bi-check-circle-fill"></i>

                <div>

                    <strong>
                        Login Successful!
                    </strong>

                    <br>

                    Welcome,
                    ${data.holderName}

                    <br>

                    Redirecting...

                </div>

            `;



					/*
                     * replace() instead of href
                     * so user doesn't return to login
                     * page using browser Back.
                     */

					setTimeout(() => {

						window.location.replace(
								"dashboard.html"
						);

					}, 1200);

				})


				.catch(error => {

					console.error(error);


					showError(
							"Invalid Account Number Or Password"
					);


					button.disabled = false;


					button.innerHTML = `

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            `;

				});

	}



	/* ================= ERROR ================= */

	function showError(message) {

		const result =
				document.getElementById("result");


		result.className = "error";


		result.innerHTML = `

            <i class="bi bi-x-circle-fill"></i>

            <div>

                ${message}

            </div>

        `;

	}

</script>


</body>

</html>
