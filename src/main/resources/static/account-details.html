<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RupeeFlow — Account Details</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root {
  --navy: #0a1628;
  --blue: #1a56db;
  --card: #182236;
  --border: #2a3a55;
  --text: #e2e8f0;
  --muted: #8a9ab5;
  --green: #10b981;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--navy);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.brand-icon {
  width: 38px;
  height: 38px;
  background: var(--blue);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.brand-name {
  font-size: 1.2rem;
  font-weight: 700;
  color: #fff;
}

.back-btn {
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  background: var(--card);
}
.back-btn:hover {
  color: #fff;
  border-color: var(--blue);
}

.page {
  max-width: 780px;
  margin: 0 auto;
  padding: 40px 24px;
}

.account-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.balance-section {
  background: var(--blue);
  padding: 32px;
  text-align: center;
}

.balance-label {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
}

.balance-amount {
  font-size: 2.4rem;
  font-weight: 700;
  color: #fff;
  margin-top: 8px;
}

.balance-status {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(16,185,129,0.15);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 0.75rem;
  color: var(--green);
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
}

.detail-box {
  background: var(--card);
  padding: 20px 24px;
}

.detail-box .d-label {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.detail-box .d-value {
  font-size: 0.95rem;
  font-weight: 600;
  color: #fff;
}

.error-state {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
}

.error-state h4 {
  color: #fff;
  margin-bottom: 5px;
}

.error-state p {
  color: var(--muted);
}

@media (max-width: 500px) {
  .details-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<!-- Topbar -->
<nav class="topbar">
  <a class="brand" href="index.html">
    <div class="brand-icon"><i class="bi bi-bank2"></i></div>
    <span class="brand-name">Rupee<span>Flow</span></span>
  </a>
  <a href="dashboard.html" class="back-btn">
    <i class="bi bi-arrow-left"></i> Back to Dashboard
  </a>
</nav>

<div class="page">

  <!-- Result -->
  <div id="result"></div>

</div>

<script>
	
	window.onload = function(){

	    const accountNumber =
	        localStorage.getItem("accountNumber");

	    if(!accountNumber){

	        window.location.href = "dashboard.html";
	        return;
	    }

	    fetch(
	        "http://localhost:9090/accounts/" +
	        accountNumber
	    )

	    .then(res => res.json())

	    .then(data => {

	        document.getElementById("result").innerHTML = `
	        <div class="account-card">

	          <div class="balance-section">

	            <div class="balance-label">
	                Current Balance
	            </div>

	            <div class="balance-amount">
	                <span>₹</span>
	                ${Number(data.balance).toLocaleString('en-IN')}
	            </div>

	            <div class="balance-status">
	                <i class="bi bi-patch-check-fill"></i>
	                Active Account
	            </div>

	          </div>

	          <div class="details-grid">

	            <div class="detail-box">
	              <div class="d-label">
	                  Account Number
	              </div>
	              <div class="d-value">
	                  ${data.accountNumber}
	              </div>
	            </div>

	            <div class="detail-box">
	              <div class="d-label">
	                  Account Holder
	              </div>
	              <div class="d-value">
	                  ${data.holderName}
	              </div>
	            </div>

	            <div class="detail-box">
	              <div class="d-label">
	                  Created At
	              </div>
	              <div class="d-value">
	                  ${data.createdAt}
	              </div>
	            </div>

	            <div class="detail-box">
	              <div class="d-label">
	                  Account Type
	              </div>
	              <div class="d-value">
	                  Savings
	              </div>
	            </div>

	          </div>

	        </div>`;
	    });

	}
	

</script>

</body>
</html>
